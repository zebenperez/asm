{% load i18n gestion_tags %}


<div class="d-none d-lg-block"> 
    <div class="row main-th py-3 m-0">
        <div class="col-4"> {% trans 'Empleado' %} </div>
        <div class="col-4"> {% trans 'Client' %} </div>
        <div class="col-4"> {% trans 'Estado' %} </div>
        {#<div class="col-3"> {% trans 'Total' %} </div>#}
    </div>

    {% for item in items %}
        <div class="row list-item pt-2 pb-2 m-0 {%if item.email == ""%}alert alert-warning{%endif%}" id="row_{{item.id}}">
            <div class="col-4">{{ item.employee__name|default:"---" }}</div>
            <div class="col-4">{{ item.client__name|default:"---" }}</div>
            <div class="col-4">{{ item.status__name|default:"---" }} </div>
            {#<div class="col-3">{{ item.total }} </div>#}
        </div>
    {% endfor %}
</div>
